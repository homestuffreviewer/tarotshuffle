<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140f24">
<title>สับไพ่ทาโรต์ 78 ใบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110c20; --bg2:#1b1433; --panel:#211940; --panel2:#2a2050; --line:#3d3170;
  --gold:#e3c27a; --gold2:#b8924a; --ink:#efe8ff; --muted:#a99cc9; --dim:#75699a; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.5}
body{
  background:radial-gradient(1200px 600px at 50% -200px,#3a2470 0%,transparent 60%),radial-gradient(800px 500px at 100% 100%,#1d1a4a 0%,transparent 60%),var(--bg);
  min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:600px;margin:0 auto;padding:10px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px}
h1{font-family:"Cinzel",serif;font-weight:700;font-size:20px;letter-spacing:.06em;margin:0;color:var(--gold)}
h1 small{display:block;font-family:"Sarabun";font-weight:400;font-size:12px;letter-spacing:0;color:var(--muted)}
.hbtns{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.iconbtn.off{opacity:.45}

/* ---------- stage ---------- */
.stage{--cw:116px;--ch:193px;position:relative;height:clamp(390px,58vh,520px);margin:8px 0 0;border-radius:22px;
  background:radial-gradient(ellipse at 50% 45%,#3d2b72 0%,#22174a 62%,#1a1236 100%);
  border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 0 70px #000a;-webkit-user-select:none;user-select:none}
.stage::before{content:"";position:absolute;inset:10px;border:1px dashed #e3c27a22;border-radius:16px;pointer-events:none}
.stage-status{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:13.5px;color:var(--gold);padding:0 20px;z-index:8;pointer-events:none}
.stage-info{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:var(--muted);transition:opacity .3s;pointer-events:none}
.stage.fanned .stage-info{opacity:0}
.ac,.deck{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2)}
.deck{cursor:pointer;transition:opacity .15s}
.deck.vanish{opacity:0;pointer-events:none}
.alayer{position:absolute;inset:0;pointer-events:none;z-index:6}
.alayer .wrapc{position:absolute;inset:0}
.cardback{position:absolute;inset:0;border-radius:9px;
  background:
    radial-gradient(circle at 50% 50%,#e3c27a 0 3px,transparent 4px),
    radial-gradient(circle at 50% 50%,transparent 0 22%,#e3c27a66 calc(22% + 1px),transparent calc(22% + 2px)),
    radial-gradient(circle at 50% 50%,transparent 0 32%,#e3c27a33 calc(32% + 1px),transparent calc(32% + 2px)),
    repeating-linear-gradient(45deg,#ffffff07 0 6px,transparent 6px 12px),
    linear-gradient(160deg,#4a2a8a,#25124f);
  border:2px solid var(--gold2);box-shadow:0 0 0 3px #1a0f38 inset,0 0 0 4px #e3c27a55 inset,0 2px 6px #0007}
.cardback::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:22px;text-shadow:0 0 8px #e3c27a99}

/* fan */
.fan{position:absolute;inset:0;touch-action:none;cursor:pointer;z-index:4}
.fc{position:absolute;left:50%;width:36px;height:60px;margin:-30px 0 0 -18px;transition:transform .55s cubic-bezier(.2,.8,.25,1),opacity .35s;will-change:transform;pointer-events:none}
.fc .cardback{border-width:1px;border-radius:4px;background:repeating-linear-gradient(45deg,#ffffff08 0 3px,transparent 3px 6px),linear-gradient(160deg,#4a2a8a,#25124f);box-shadow:0 0 0 2px #1a0f38 inset,0 0 0 3px #e3c27a44 inset,1px 1px 3px #0009}
.fc .cardback::after{font-size:9px;text-shadow:none}
.fc.lift{z-index:5;transition-duration:.15s;transition-delay:0s!important}
.fc.lift .cardback{box-shadow:0 0 0 2px #1a0f38 inset,0 0 0 2px var(--gold),0 0 14px var(--gold)}
.fc.fly{transition:transform .45s ease-in,opacity .45s ease-in;opacity:0}
.fan-hint{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;line-height:1.6}

/* shuffle buttons */
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sbtn{height:96px;border-radius:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);display:grid;place-items:center;transition:transform .1s,border-color .2s,opacity .2s}
.sbtn:hover{border-color:#e3c27a77}
.sbtn:active{transform:scale(.96)}
.sbtn:disabled{opacity:.4}
.sbtn svg{height:70px;width:auto;overflow:visible}

.sec-title{font-size:13px;color:var(--muted);margin:16px 2px 8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--muted)}
.chip.on{background:#e3c27a22;border-color:var(--gold2);color:var(--gold)}
.ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:14px}
.note{font-size:13px;color:var(--muted)}

/* drawn cards */
.spread{display:grid;gap:12px;margin-top:14px;justify-content:center}
.spread.s1{grid-template-columns:min(240px,62vw)}
.spread.s2{grid-template-columns:repeat(2,minmax(0,200px))}
.spread.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.slot .pos{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;min-height:2.5em;display:flex;align-items:flex-end}
.flip{width:100%;aspect-ratio:3/5;perspective:900px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.up .flip-inner{transform:rotateY(180deg)}
.flip .back,.flip .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.dealt{animation:deal .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes deal{from{opacity:0;transform:translateY(-60px) scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;border-radius:8px;overflow:hidden;background:#efe6cf;box-shadow:0 0 0 1px #0004,0 3px 10px #000a}
.face img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-select:none;user-select:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#0a0716cc;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:86vh;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h3{margin:0 0 4px;font-size:18px;color:var(--gold)}
.sheet h3 small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.sheet .close{float:right;margin:-4px -4px 0 0}
.detail{display:flex;gap:14px;align-items:flex-start}
.detail .flip{width:140px;flex:none;cursor:default}
.kw{display:inline-block;margin:2px 4px 2px 0;padding:2px 9px;border-radius:999px;background:#ffffff0d;font-size:13px}
.decklist{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:12px;font-size:12.5px}
.decklist li{break-inside:avoid;padding:3px 0;border-bottom:1px solid #ffffff08;display:flex;gap:6px}
.decklist li .n{color:var(--dim);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:#2a2050;border:1px solid var(--gold2);color:var(--gold);padding:8px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.credit{font-size:11.5px;color:var(--dim);text-align:center;margin:26px 4px 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TAROT SHUFFLE<small>สับไพ่ทาโรต์ 78 ใบ · สุ่มด้วยความน่าจะเป็นทุกครั้ง</small></h1>
    <div class="hbtns">
      <button class="iconbtn" id="deckBtn" aria-label="ดูลำดับไพ่ในสำรับ" title="สำรับ">☰</button>
      <button class="iconbtn" id="soundBtn" aria-label="เปิด/ปิดเสียง">🔊</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="stage-status" id="status">สับไพ่ด้วยปุ่มด้านล่าง หรือแตะสำรับเพื่อแผ่ไพ่</div>
    <div class="deck" id="deck" aria-label="สำรับไพ่ แตะเพื่อแผ่"><div class="cardback"></div></div>
    <div class="stage-info" id="stageInfo"></div>
  </div>

  <div class="sbtns">
    <button class="sbtn" data-k="riffle" aria-label="Riffle shuffle" title="Riffle">
      <svg viewBox="0 0 120 80" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <g transform="rotate(-16 30 50)"><rect x="10" y="26" width="34" height="46" rx="4" fill="#3a2a6e" stroke="#e3c27a" stroke-width="2"/><path d="M14 74 h30 M16 77 h28" stroke="#e3c27a88" stroke-width="1.5"/></g>
        <g transform="rotate(16 90 50)"><rect x="76" y="26" width="34" height="46" rx="4" fill="#3a2a6e" stroke="#e3c27a" stroke-width="2"/><path d="M76 74 h30 M76 77 h28" stroke="#e3c27a88" stroke-width="1.5"/></g>
        <g stroke="#e3c27a" stroke-width="2.2"><path d="M50 30 l10 7 l10 -7"/><path d="M50 40 l10 7 l10 -7"/><path d="M50 50 l10 7 l10 -7"/></g>
        <path d="M44 14 q16 -12 32 0" stroke="#e3c27a99" stroke-width="2"/><path d="M73 9 l3 5 l-6 1" stroke="#e3c27a99" stroke-width="2"/>
      </svg>
    </button>
    <button class="sbtn" data-k="overhand" aria-label="Overhand shuffle" title="Overhand">
      <svg viewBox="0 0 120 80" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <g transform="rotate(10 88 48)"><rect x="70" y="22" width="36" height="50" rx="4" fill="#3a2a6e" stroke="#e3c27a" stroke-width="2"/><path d="M73 74 h32 M75 77 h30" stroke="#e3c27a88" stroke-width="1.5"/></g>
        <rect x="12" y="44" width="36" height="28" rx="4" fill="#3a2a6e" stroke="#e3c27a" stroke-width="2"/><path d="M14 74 h32 M16 77 h30" stroke="#e3c27a88" stroke-width="1.5"/>
        <g transform="rotate(-14 44 26)"><rect x="30" y="14" width="30" height="20" rx="3" fill="#4a3688" stroke="#e3c27a" stroke-width="2"/></g>
        <path d="M68 18 q-6 -12 -20 -8" stroke="#e3c27a99" stroke-width="2"/><path d="M52 6 l-5 4 l5 4" stroke="#e3c27a99" stroke-width="2"/>
        <path d="M28 38 v-0 M32 40 v0" stroke="#e3c27a" stroke-width="2"/>
      </svg>
    </button>
  </div>

  <div class="sec-title">รูปแบบการวางไพ่</div>
  <div class="row" id="spreadChips"></div>
  <div class="row" style="margin-top:10px;justify-content:space-between">
    <button class="ghost" id="revealAll">เปิดทั้งหมด</button>
    <button class="ghost" id="returnBtn">เก็บไพ่คืนใต้สำรับ</button>
  </div>
  <div id="spreadArea"></div>
  <p class="credit">ภาพไพ่: Rider–Waite–Smith ต้นฉบับปี 1909 วาดโดย Pamela Colman Smith (สาธารณสมบัติ)</p>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   1. RANDOMNESS — crypto-grade, unbiased
   ========================================================= */
const RNG = (() => {
  const buf = new Uint32Array(256); let idx = 256;
  const u32 = () => { if (idx >= 256) { crypto.getRandomValues(buf); idx = 0; } return buf[idx++]; };
  const rand = () => (u32() * 2097152 + (u32() >>> 11)) / 9007199254740992; // 53-bit float [0,1)
  const int = n => { const lim = Math.floor(4294967296 / n) * n; let x; do { x = u32(); } while (x >= lim); return x % n; };
  const bern = p => rand() < p;
  const binom = (n, p) => { let k = 0; for (let i = 0; i < n; i++) if (rand() < p) k++; return k; };
  const normal = () => { let u = 0; while (u === 0) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); };
  const perm = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { u32, rand, int, bern, binom, normal, perm };
})();

/* =========================================================
   2. THE 78 CARDS
   ========================================================= */
const MAJORS = [
 ["The Fool","คนโง่ (คนเขลา)",["การเริ่มต้นใหม่","อิสระ","กล้าเสี่ยง"],["ประมาท","ลังเล","หลงทาง"]],
 ["The Magician","นักมายากล",["ความสามารถ","ลงมือทำ","พลังสร้างสรรค์"],["หลอกลวง","ใช้พลังผิดทาง","ขาดแผน"]],
 ["The High Priestess","นักบวชหญิง",["สัญชาตญาณ","ความลับ","ปัญญาภายใน"],["เพิกเฉยเสียงใน","ความลับถูกเปิด","สับสน"]],
 ["The Empress","จักรพรรดินี",["ความอุดมสมบูรณ์","ความรักความเมตตา","ธรรมชาติ"],["พึ่งพามากเกิน","ขาดการดูแลตัวเอง","ติดขัด"]],
 ["The Emperor","จักรพรรดิ",["อำนาจ","ระเบียบ","ความมั่นคง"],["ควบคุมเกินไป","ดื้อรั้น","ขาดวินัย"]],
 ["The Hierophant","พระสังฆราช",["ประเพณี","ครูบาอาจารย์","ความเชื่อ"],["แหกกฎ","ตั้งคำถามกับระบบ","อิสระทางความคิด"]],
 ["The Lovers","คู่รัก",["ความรัก","การเลือก","ความกลมกลืน"],["ไม่ลงรอย","เลือกผิด","ขาดสมดุล"]],
 ["The Chariot","รถศึก",["ชัยชนะ","มุ่งมั่น","ควบคุมทิศทาง"],["ไร้ทิศทาง","ขาดการควบคุม","ขัดแย้งในใจ"]],
 ["Strength","พลัง (ความเข้มแข็ง)",["ความกล้าหาญ","ความอดทน","ความอ่อนโยนที่แข็งแกร่ง"],["ไม่มั่นใจ","อ่อนแอ","ใช้อารมณ์"]],
 ["The Hermit","ฤๅษี",["การใคร่ครวญ","อยู่กับตัวเอง","แสวงหาความจริง"],["โดดเดี่ยวเกินไป","ปิดกั้นตัวเอง","หลงทาง"]],
 ["Wheel of Fortune","กงล้อแห่งโชคชะตา",["การเปลี่ยนแปลง","โชค","วัฏจักร"],["โชคร้าย","ต้านการเปลี่ยนแปลง","วนซ้ำ"]],
 ["Justice","ความยุติธรรม",["ความเป็นธรรม","ความจริง","เหตุและผล"],["ไม่ยุติธรรม","หลีกเลี่ยงความรับผิดชอบ","อคติ"]],
 ["The Hanged Man","คนแขวน",["การรอคอย","มองมุมใหม่","การยอมปล่อย"],["ยื้อเวลา","ต่อต้าน","เสียสละเปล่า"]],
 ["Death","ความตาย (การสิ้นสุด)",["การสิ้นสุดเพื่อเริ่มใหม่","การเปลี่ยนผ่าน","ปล่อยวาง"],["กลัวการเปลี่ยนแปลง","ยึดติด","ค้างคา"]],
 ["Temperance","ความพอดี",["สมดุล","ความอดทน","การผสมผสาน"],["สุดโต่ง","ไม่สมดุล","ใจร้อน"]],
 ["The Devil","ปีศาจ",["พันธนาการ","ความยึดติด","กิเลส"],["หลุดพ้น","ตระหนักรู้","ทวงคืนอำนาจ"]],
 ["The Tower","หอคอย",["การเปลี่ยนแปลงฉับพลัน","สิ่งเดิมพังทลาย","การตื่นรู้"],["หลีกเลี่ยงหายนะ","กลัวการเปลี่ยนแปลง","ยืดเยื้อ"]],
 ["The Star","ดวงดาว",["ความหวัง","แรงบันดาลใจ","การเยียวยา"],["หมดหวัง","ขาดศรัทธา","ท้อแท้"]],
 ["The Moon","ดวงจันทร์",["ความไม่แน่นอน","ภาพลวงตา","จิตใต้สำนึก"],["ความจริงปรากฏ","คลายความกลัว","ความสับสนลดลง"]],
 ["The Sun","ดวงอาทิตย์",["ความสุข","ความสำเร็จ","พลังบวก"],["ความสุขถูกบดบัง","มองโลกดีเกิน","ล่าช้า"]],
 ["Judgement","การพิพากษา",["การตื่นรู้","การตัดสินใจครั้งสำคัญ","การให้อภัย"],["สงสัยในตัวเอง","ตัดสินผู้อื่น","ไม่ยอมเรียนรู้"]],
 ["The World","โลก",["ความสมบูรณ์","ความสำเร็จ","การเดินทาง"],["ยังไม่จบ","ขาดความต่อเนื่อง","ทางลัด"]]
];
const ROMAN = ["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
const SUITS = [
  {key:"wands",en:"Wands",th:"ไม้เท้า",c:"var(--wands)",hex:"#c8572c",dom:"การงาน พลัง แรงบันดาลใจ"},
  {key:"cups",en:"Cups",th:"ถ้วย",c:"var(--cups)",hex:"#2f72b0",dom:"ความรู้สึก ความรัก ความสัมพันธ์"},
  {key:"swords",en:"Swords",th:"ดาบ",c:"var(--swords)",hex:"#5e6b80",dom:"ความคิด การสื่อสาร ความขัดแย้ง"},
  {key:"pentacles",en:"Pentacles",th:"เหรียญ",c:"var(--pent)",hex:"#b98a24",dom:"เงิน งาน สิ่งของ สุขภาพ"}
];
const RANKS = [
  {en:"Ace",th:"เอซ",up:"จุดเริ่มต้น โอกาสใหม่",rv:"โอกาสหลุดมือ เริ่มไม่ได้"},

/* =========================================================
   3. SETTINGS (fixed) & SHUFFLE MODELS

const CFG = {ovSize: 6, autoFanDelay: 1300};

const clampCut = (k, n) => Math.max(1, Math.min(n - 1, k));

/* Riffle — Gilbert–Shannon–Reeds model.
   Cut k ~ Binomial(n, ½); cards fall from each half with probability ∝ cards left in that half. */
function riffle(d) {
  const n = d.length, k = clampCut(RNG.binom(n, .5), n);
  const A = d.slice(0, k), B = d.slice(k);
  const out = [], seq = []; let i = 0, j = 0;
  while (i < A.length || j < B.length) {
    const a = A.length - i, b = B.length - j, side = RNG.rand() * (a + b) < a ? 0 : 1;
    seq.push(side); out.push(side === 0 ? A[i++] : B[j++]);
  }
  return {deck: out, k, seq};
}
/* Overhand — Pemantle's model: each of the n−1 gaps is a packet break with probability p = 1/mean size;
   packets are taken from the top and stacked, so packet order reverses. */
function overhand(d) {
  const p = 1 / CFG.ovSize, packets = []; let cur = [d[0]];
  for (let i = 1; i < d.length; i++) { if (RNG.bern(p)) { packets.push(cur); cur = []; } cur.push(d[i]); }
  packets.push(cur);
  return {deck: packets.slice().reverse().flat(), sizes: packets.map(x => x.length)};
}

/* =========================================================
   4. SOUND — synthesized with Web Audio (no files)
   ========================================================= */
const Snd = (() => {
  let ac = null, noise = null, master = null;
  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return true; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2; noise = ac.createBuffer(1, len, ac.sampleRate);
      const ch = noise.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;

      master.connect(comp).connect(ac.destination); return true;
    } catch (e) { return false; }
  }

    const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + Math.min(.004, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(out(pan)); src.start(t, Math.random() * 1.6, dur + .05);
  }
  function swell(t, dur, freq, gain, f2) {
    const src = ac.createBufferSource(); src.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = .7;
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * .35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master); src.start(t, Math.random(), dur + .05);
  }
  function thump(t, gain = .35, f0 = 140) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .16);

    [1, 1.5, 2.01].forEach((m, i) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = base * m;
      g.gain.setValueAtTime(0.0001, t + i * .04); g.gain.exponentialRampToValueAtTime(gain / (i + 1), t + i * .04 + .01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * .04 + 1.2);
      o.connect(g).connect(master); o.start(t + i * .04); o.stop(t + i * .04 + 1.3);
    });
  }
  const R = Math.random;
  const lib = {
    split(t) { swell(t, .32, 1500, .13, 3400); burst(t + .03, .05, 900, 1, .07, "lowpass"); },
    drop(t, pan) { burst(t, .013, 2300 + R() * 3000, 1.3, .16 + R() * .09, "bandpass", null, pan); },
    bridge(t) { swell(t, .42, 2600, .15, 700); for (let i = 0; i < 16; i++) burst(t + .06 + i * .015, .012, 3000 + R() * 2200, 1.5, .06); },
    square(t) { thump(t, .22, 120); burst(t + .01, .05, 1400, 1, .08, "lowpass"); },
    lift(t) { swell(t, .18, 2200, .08, 1100); },
    packet(t) { burst(t, .08, 1700 + R() * 1000, .9, .18, "bandpass", 900); burst(t + .07, .03, 600, 1, .11, "lowpass"); },
    spread(t) { swell(t, .8, 1100, .1, 3200); for (let i = 0; i < 46; i++) burst(t + .05 + i * .016 + R() * .004, .03, 2400 + R() * 2400, 1.2, .07); },
    gather(t) { swell(t, .45, 3000, .12, 900); for (let i = 0; i < 20; i++) burst(t + i * .018, .02, 2000 + R() * 1500, 1.2, .05); thump(t + .5, .2, 120); },
    hover(t) { burst(t, .012, 4200 + R() * 800, 2.5, .05); },
    draw(t) { swell(t, .22, 4000, .16, 1500); burst(t + .2, .025, 1500, 1, .12, "lowpass"); },
    flip(t) { burst(t, .05, 3200, 1.1, .16); burst(t + .06, .04, 1200, 1, .08, "lowpass"); chime(t + .08, 520 + R() * 200, .035); },

})();
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* a card stack with visible thickness (paper edges) */
function setThick(el, m) {
  const t = Math.max(1, Math.round(m * .16)), sh = ["0 0 0 3px #1a0f38 inset", "0 0 0 4px #e3c27a55 inset"];
  for (let i = 1; i <= t; i++) sh.push(`${-i * .3}px ${i}px 0 ${i % 2 ? "#2a1856" : "#b8924a"}`);
  sh.push(`${-t * .3}px ${t + 4}px 10px #000a`);
  const cb = el.querySelector(".cardback"); cb.style.boxShadow = sh.join(","); cb.style.transform = `translateY(${-t}px)`;
}
function makeStack(m, z) { const el = document.createElement("div"); el.className = "ac"; el.innerHTML = `<div class="cardback"></div>`; if (m) setThick(el, m); if (z != null) el.style.zIndex = z; return el; }
function anim(el, kf, o) { return el.animate(kf, Object.assign({fill: "forwards", easing: "cubic-bezier(.3,.7,.3,1)"}, o)).finished.catch(() => {}); }

/* =========================================================
   6. SHUFFLE ANIMATIONS — they replay the actual random result
   ========================================================= */
async function animRiffle(r, n) {
  const st = $("#stage"), W = st.clientWidth, cw = cssPx("--cw"), k = r.k;
  const layer = document.createElement("div"); layer.className = "alayer"; st.appendChild(layer);
  const L = makeStack(k, 6), Rt = makeStack(n - k, 5); layer.append(Rt, L);
  $("#deck").classList.add("vanish");
  const tL = 0, tR = 0, dx = Math.min(W * .27, 120);
  // 1) split the deck in two, (sometimes turning one half 180°)
  Snd.play("split"); buzz(8);
  const sL = `translate(${-dx}px,-14px) rotate(${-9 + tL}deg)`, sR = `translate(${dx}px,8px) rotate(${9 + tR}deg)`;
  await Promise.all([anim(L, [{transform: "none"}, {transform: sL}], {duration: 360}),
                     anim(Rt, [{transform: "none"}, {transform: sR}], {duration: 360})]);
  // 2) bring the halves end to end, thumbs lifting the inner corners
  const pL = `translate(${-cw * .74}px,4px) rotate(${-10 + tL}deg)`, pR = `translate(${cw * .74}px,4px) rotate(${10 + tR}deg)`;
  const eL = `translate(${-cw * .42}px,2px) rotate(-5deg)`, eR = `translate(${cw * .42}px,2px) rotate(5deg)`;
  await Promise.all([anim(L, [{transform: sL}, {transform: pL}], {duration: 240}), anim(Rt, [{transform: sR}, {transform: pR}], {duration: 240})]);
  // 3) cards fall alternately — bottom card first — exactly following the model's interleaving
  const pile = document.createElement("div"); pile.className = "wrapc"; pile.style.zIndex = 4; layer.appendChild(pile);
  const drops = r.seq.slice().reverse(), D = 1050, dt = D / drops.length;
  let lc = k, rc = n - k; const t0 = performance.now();
  drops.forEach((s, i) => Snd.at("drop", i * dt / 1000, s ? .45 : -.45));
  for (let i = 0; i < drops.length; i++) {
    const s = drops[i], c = makeStack(0); c.style.zIndex = i; pile.appendChild(c);
    const jx = (Math.random() - .5) * 5, jr = (Math.random() - .5) * 2.4;
    anim(c, [{transform: s ? eR : eL}, {transform: `translate(${jx}px,${-i * .16}px) rotate(${jr}deg)`}], {duration: 110, easing: "ease-in"});
    if (s) { rc--; rc ? setThick(Rt, rc) : (Rt.style.opacity = 0); } else { lc--; lc ? setThick(L, lc) : (L.style.opacity = 0); }
    const wait = t0 + (i + 1) * dt - performance.now(); if (wait > 0) await sleep(wait);
  }
  await sleep(150);
  // 4) bridge and square up
  Snd.play("bridge");
  await anim(pile, [{transform: "none"}, {transform: "scale(1.05,.95) translateY(-6px)", offset: .45}, {transform: "none"}], {duration: 420, easing: "ease-in-out"});
  Snd.play("square");
  layer.remove(); $("#deck").classList.remove("vanish");
}
async function animOverhand(r, n) {
  const st = $("#stage"), W = st.clientWidth, sizes = r.sizes;
  const layer = document.createElement("div"); layer.className = "alayer"; st.appendChild(layer);
  const hand = Math.min(W * .22, 95), H = makeStack(n, 200); layer.appendChild(H);
  $("#deck").classList.add("vanish");
  const hT = `translate(${hand}px,-10px) rotate(8deg)`;
  Snd.play("lift");
  await anim(H, [{transform: "none"}, {transform: hT}], {duration: 280});
  let left = n, y = 0; const dur = Math.max(130, 260 - sizes.length * 6), packets = [];
  for (let i = 0; i < sizes.length; i++) {
    const sz = sizes[i], P = makeStack(sz, 10 + i); layer.appendChild(P); packets.push([P, y]);
    left -= sz; left ? setThick(H, left) : (H.style.opacity = 0);
    const jr = (Math.random() - .5) * 9, jx = (Math.random() - .5) * 10;
    Snd.at("packet", dur * .75 / 1000); buzz(5);
    anim(P, [{transform: hT}, {transform: `translate(${hand * .1}px,${-44 - y}px) rotate(${(8 + jr) / 2}deg)`, offset: .45},
             {transform: `translate(${-hand + jx}px,${-y}px) rotate(${jr}deg)`}], {duration: dur, easing: "ease-out"});
    y += sz * .16;
    await sleep(dur * .8 + 25 + Math.random() * 40);
  }
  await sleep(dur * .4 + 120);
  // square the new pile back to the centre
  await Promise.all(packets.map(([P, py]) => anim(P, [{transform: getComputedStyle(P).transform}, {transform: `translate(0,${-py}px)`}], {duration: 300, easing: "ease-in-out"})));

  layer.remove(); $("#deck").classList.remove("vanish");
}
async function doShuffle(key) {
  if (busy) return;
  if (S.deck.length < 2) { toast("ไพ่ในสำรับไม่พอให้สับ — เก็บไพ่คืนก่อน"); return; }
  clearTimeout(fanTimer); busy = true; setBusy(true);
  try {
    await Fan.hide();
    const n = S.deck.length;
    if (key === "riffle") {
      const r = riffle(S.deck);
      status(`Riffle · แบ่ง ${r.k}/${n - r.k} ใบ`);
      await animRiffle(r, n); S.deck = r.deck;
    } else {
      const r = overhand(S.deck);
      status(`Overhand · ${r.sizes.length} ก้อน`);
      await animOverhand(r, n); S.deck = r.deck;
    }
    S.ops++; renderAll();
  } finally { busy = false; setBusy(false); }
  if (S.deck.length > 1) {
    status("สับต่อได้เลย · หยุดสับแล้วไพ่จะแผ่ออกให้เลือก");
    fanTimer = setTimeout(() => { if (!busy) Fan.show(); }, CFG.autoFanDelay);
  }
}
function setBusy(b) { $$(".sbtn").forEach(x => x.disabled = b); }

/* =========================================================
   7. FAN — the deck laid out in an arch for choosing
   ========================================================= */
const Fan = {
  on: false, box: null, hint: null, els: new Map(), idx: new Map(), pos: new Map(), n: 0, lifted: null, g: null, down: false,
  geom() {
    const st = $("#stage"), W = st.clientWidth, H = st.clientHeight, R = Math.max(90, Math.min(W / 2 - 40, H / 2 - 56));
    return {W, H, R, py: H / 2 + 10, cy: H / 2};
  },
  place(i) {
    const deg = 360 * i / this.n, th = deg * Math.PI / 180;
    return {x: this.g.R * Math.sin(th), y: -this.g.R * Math.cos(th), rot: deg};
  },
  tf(id, lift = 0) { const p = this.pos.get(id); return `translate(${p.x}px,${p.y}px) rotate(${p.rot}deg) translateY(${-lift}px)`; },
  collapsed() { return `translate(0px,${this.g.cy - this.g.py}px) scale(${cssPx("--cw") / 36})`; },
  async show() {
    clearTimeout(fanTimer);
    if (this.on || !S.deck.length) return;
    this.on = true; const st = $("#stage"); st.classList.add("fanned");
    this.g = this.geom(); this.n = S.deck.length;
    const box = document.createElement("div"); box.className = "fan"; this.box = box;
    this.els.clear(); this.pos.clear(); this.idx.clear();
    S.deck.forEach((c, i) => {
      const el = document.createElement("div"); el.className = "fc"; el.innerHTML = `<div class="cardback"></div>`;
      el.style.top = this.g.py + "px"; el.style.transform = this.collapsed();
      this.idx.set(c.id, i); this.pos.set(c.id, this.place(i)); this.els.set(c.id, el); box.appendChild(el);
    });
    const hint = document.createElement("div"); hint.className = "fan-hint"; this.hint = hint;
    hint.style.top = (this.g.py - 34) + "px"; this.updateHint();
    box.appendChild(hint); st.appendChild(box); $("#deck").classList.add("vanish"); this.bind(box);
    void box.offsetWidth;
    let i = 0; this.els.forEach((el, id) => { el.style.transitionDelay = (i++ * 7) + "ms"; el.style.transform = this.tf(id); });
    Snd.play("spread"); buzz(15); fanStatus();
    await sleep(560 + this.n * 7);
    this.els.forEach(el => el.style.transitionDelay = "0ms");
  },
  updateHint() { if (this.hint) this.hint.innerHTML = `${this.els.size} ใบ<br>ลากนิ้วไปตามแนวไพ่<br>แล้วปล่อยเพื่อเลือก`; },
  async hide() {
    clearTimeout(fanTimer);
    if (!this.on) return; this.on = false; this.setLift(null);
    const st = $("#stage"), arr = [...this.els.values()], box = this.box;
    if (arr.length) {
      arr.forEach((el, i) => { el.style.transitionDelay = ((arr.length - i) * 4) + "ms"; el.style.transform = this.collapsed(); });
      if (this.hint) this.hint.style.opacity = 0;
      Snd.play("gather"); await sleep(520 + arr.length * 4);
    }
    box && box.remove(); this.box = null; this.els.clear();
    $("#deck").classList.remove("vanish"); st.classList.remove("fanned");
  },
  remove(id) {
    const el = this.els.get(id); if (!el) return;
    if (this.lifted === id) this.lifted = null;
    el.classList.remove("lift"); el.classList.add("fly"); el.style.transform = this.tf(id, 90) + " scale(1.8)";
    this.els.delete(id); setTimeout(() => el.remove(), 500); this.updateHint();
    if (!this.els.size) setTimeout(() => this.hide(), 450);
  },
  relayout() {
    if (!this.on || !this.box) return; this.g = this.geom();
    this.els.forEach((el, id) => { this.pos.set(id, this.place(this.idx.get(id))); el.style.top = this.g.py + "px"; el.style.transform = this.tf(id); });
    if (this.hint) this.hint.style.top = (this.g.py - 34) + "px";
  },
  nearest(ev) {
    if (!this.g) return null;
    const r = $("#stage").getBoundingClientRect(), x = ev.clientX - r.left - this.g.W / 2, y = ev.clientY - r.top - this.g.py;
    let best = null, bd = 1e9;
    this.els.forEach((el, id) => { const p = this.pos.get(id), d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = id; } });
    return bd < 38 ? best : null;
  },
  setLift(id) {
    if (id === this.lifted) return;
    const prev = this.els.get(this.lifted); if (prev) { prev.classList.remove("lift"); prev.style.transform = this.tf(this.lifted); }
    this.lifted = id; const el = this.els.get(id);
    if (el) { el.classList.add("lift"); el.style.transform = this.tf(id, 18); Snd.play("hover"); buzz(4); }
  },
  bind(box) {
    box.addEventListener("pointerdown", e => { if (busy) return; Snd.unlock(); this.down = true; try { box.setPointerCapture(e.pointerId); } catch (_) {} this.setLift(this.nearest(e)); });
    box.addEventListener("pointermove", e => { if (busy) return; if (this.down || e.pointerType === "mouse") this.setLift(this.nearest(e)); });
    box.addEventListener("pointerup", () => { const id = this.lifted, was = this.down; this.down = false; if (was && id != null) pickFromFan(id); });
    box.addEventListener("pointercancel", () => { this.down = false; this.setLift(null); });
    box.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") this.setLift(null); });
  }
};

/* =========================================================
   8. SPREADS & DRAWING (always chosen by hand from the fan)
   ========================================================= */
const SPREADS = {
  s1: {name: "1 ใบ", pos: ["คำตอบ / คำแนะนำวันนี้"]},
  s3: {name: "3 ใบ", pos: ["อดีต", "ปัจจุบัน", "อนาคต"]},
  s5: {name: "5 ใบ", pos: ["สถานการณ์", "อุปสรรค", "สิ่งที่ซ่อนอยู่", "คำแนะนำ", "ผลลัพธ์"]},
  s10: {name: "Celtic Cross", pos: ["ปัจจุบัน", "อุปสรรค", "รากฐาน", "อดีต", "เป้าหมาย", "อนาคตอันใกล้", "ตัวคุณ", "สิ่งแวดล้อม", "ความหวัง/ความกลัว", "ผลลัพธ์"]},
  sfree: {name: "จั่วอิสระ", pos: []}
};
const spreadNeed = () => { const p = SPREADS[S.spread].pos.length; return p ? Math.max(0, p - S.drawn.length) : 1; };
function fanStatus() {
  const p = SPREADS[S.spread].pos.length, need = spreadNeed();
  status(p ? (need ? `${SPREADS[S.spread].name} · เลือกไพ่อีก ${need} ใบ` : "เลือกครบแล้ว — แตะไพ่ด้านล่างเพื่อเปิด") : `จั่วอิสระ · เลือกแล้ว ${S.drawn.length} ใบ`);
}
function pickFromFan(id) {
  if (busy) return;
  if (!spreadNeed()) { Fan.setLift(null); toast("ครบตำแหน่งแล้ว — เก็บไพ่คืน หรือเลือก “จั่วอิสระ”"); return; }
  const idx = S.deck.findIndex(c => c.id === id); if (idx < 0) return;
  const c = S.deck.splice(idx, 1)[0]; Fan.remove(c.id);
  newFrom = S.drawn.length;
  S.drawn.push({id: c.id, open: false, pos: SPREADS[S.spread].pos[S.drawn.length] || null});
  Snd.play("draw"); buzz(12); renderAll(); fanStatus();
  if (SPREADS[S.spread].pos.length && !spreadNeed()) setTimeout(() => $("#spreadArea").scrollIntoView({behavior: "smooth", block: "start"}), 650);
}
function renderSpreadChips() {
  $("#spreadChips").innerHTML = Object.entries(SPREADS).map(([k, s]) => `<button class="chip ${S.spread === k ? "on" : ""}" data-s="${k}">${s.name}</button>`).join("");
}
let newFrom = -1;
function renderSpread() {
  const area = $("#spreadArea");
  if (!S.drawn.length) { area.innerHTML = `<div class="empty" style="margin-top:10px">ยังไม่ได้เลือกไพ่ — สับแล้วเลือกจากไพ่ที่แผ่ไว้ด้านบน</div>`; return; }
  const n = S.drawn.length, cls = n === 1 ? "s1" : n === 2 ? "s2" : "s3";
  area.innerHTML = `<div class="spread ${cls}">${S.drawn.map((d, i) => {
    const isNew = newFrom >= 0 && i >= newFrom;
    return `<div class="slot ${isNew ? "dealt" : ""}"><div class="pos">${d.pos || `ใบที่ ${i + 1}`}</div>
      <div class="flip ${d.open ? "up" : ""}" data-i="${i}"><div class="flip-inner"><div class="back"><div class="cardback"></div></div><div class="front">${faceHTML(d)}</div></div></div></div>`; }).join("")}</div>`;
  newFrom = -1;
}
function revealCard(i) {
  const d = S.drawn[i]; if (!d) return;
  if (!d.open) { d.open = true; Snd.play("flip"); buzz(20); renderSpread(); save(); } else showDetail(d);
}
function showDetail(d) {
  const k = CARDS[d.id], kw = arr => arr.map(x => `<span class="kw">${x}</span>`).join("");
  openModal(`<button class="iconbtn close" data-close>✕</button>
    <h3>${k.en}<small>${k.th}${d.pos ? " · ตำแหน่ง: " + d.pos : ""}</small></h3>
    <div class="detail" style="margin-top:10px"><div class="flip up"><div class="flip-inner"><div class="front">${faceHTML(d)}</div></div></div>
    <div><div style="font-size:13px;color:var(--muted)">ความหมาย</div><div style="margin:4px 0 10px">${kw(k.up)}</div>
    ${k.major ? `<p style="font-size:13px;color:var(--muted)">ไพ่ชุดใหญ่ (Major Arcana) ใบที่ ${k.top}</p>` : `<p style="font-size:13px;color:var(--muted)">ชุด${SUITS[k.suit].th} (${SUITS[k.suit].en}) — ${SUITS[k.suit].dom}</p>`}</div></div>
    <p style="font-size:12px;color:var(--dim)">คำสำคัญเป็นแนวทางย่อ ๆ เพื่อการตีความ ไม่ใช่คำทำนายตายตัว</p>`);
}
async function returnCards() {
  if (!S.drawn.length || busy) return;
  await Fan.hide();
  S.drawn.forEach(d => S.deck.push({id: d.id})); S.drawn = [];
  Snd.play("cut"); renderAll(); toast("เก็บไพ่คืนใต้สำรับแล้ว"); status("เก็บไพ่คืนแล้ว — สับใหม่ได้เลย");
  window.scrollTo({top: 0, behavior: "smooth"});
}
function openDeckSheet() {
  openModal(`<button class="iconbtn close" data-close>✕</button><h3>ลำดับไพ่ในสำรับ<small>${S.deck.length} ใบ · 1 = ใบบนสุด</small></h3>
    <div class="row" style="margin-top:10px;gap:8px"><button class="ghost" data-act="reset">↺ สำรับใหม่ (เรียงลำดับ)</button></div>
    <ul class="decklist">${S.deck.map((c, i) => `<li><span class="n">${i + 1}</span><span>${CARDS[c.id].en}</span></li>`).join("") || `<li>สำรับว่าง</li>`}</ul>`);
}

/* =========================================================
   9. RENDER & WIRING
   ========================================================= */
function renderDeck() {
  const n = S.deck.length, d = $("#deck");
  d.style.visibility = n ? "visible" : "hidden"; if (n) setThick(d, n);
  $("#stageInfo").textContent = n ? `ในสำรับ ${n} ใบ · แตะสำรับเพื่อแผ่ไพ่` : "สำรับว่าง — เก็บไพ่คืนก่อน";
}
function renderAll() { renderDeck(); renderSpread(); save(); }
function openModal(html) { $("#sheet").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }

document.addEventListener("pointerdown", () => Snd.unlock(), {once: true});
$$(".sbtn").forEach(b => b.addEventListener("click", () => { Snd.unlock(); doShuffle(b.dataset.k); }));
$("#deck").addEventListener("click", () => { if (busy) return; Snd.unlock(); Fan.show(); });
$("#spreadChips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; S.spread = c.dataset.s; renderSpreadChips(); if (Fan.on) fanStatus(); save(); });
$("#spreadArea").addEventListener("click", e => { const f = e.target.closest(".flip"); if (f) revealCard(+f.dataset.i); });
$("#revealAll").addEventListener("click", async () => {
  for (let i = 0; i < S.drawn.length; i++) if (!S.drawn[i].open) { S.drawn[i].open = true; Snd.play("flip"); renderSpread(); await sleep(180); }
  save();
});
$("#returnBtn").addEventListener("click", returnCards);
$("#soundBtn").addEventListener("click", () => { S.sound = !S.sound; $("#soundBtn").classList.toggle("off", !S.sound); $("#soundBtn").textContent = S.sound ? "🔊" : "🔇"; if (S.sound) { Snd.unlock(); Snd.play("tick"); } save(); });
$("#deckBtn").addEventListener("click", openDeckSheet);
$("#modal").addEventListener("click", async e => {
  if (e.target.id === "modal" || e.target.closest("[data-close]")) return closeModal();
  const a = e.target.closest("[data-act]"); if (!a || busy) return;
  closeModal(); await Fan.hide();
  if (a.dataset.act === "reset") { S.deck = freshDeck(); S.drawn = []; S.ops = 0; Snd.play("cut"); renderAll(); status("สำรับใหม่ เรียงจาก The Fool → King of Pentacles"); toast("รีเซ็ตเป็นสำรับใหม่แล้ว"); }
});
window.addEventListener("resize", () => Fan.relayout());

load(); renderSpreadChips(); renderAll();
$("#soundBtn").classList.toggle("off", !S.sound); $("#soundBtn").textContent = S.sound ? "🔊" : "🔇";
if (S.ops) status(`สับไปแล้ว ${S.ops} ครั้ง — สับต่อ หรือแตะสำรับเพื่อแผ่ไพ่`);
</script>
</body>
